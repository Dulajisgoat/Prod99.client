<!DOCTYPE html>
<html lang="en" data-theme="light" class="boot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Prod99</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/favicon.png">
<script>
(function(){
  try{
    var t = localStorage.getItem('prod99_theme');
    if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
    if(localStorage.getItem('prod99_power') === 'low'){ document.documentElement.setAttribute('data-power', 'low'); }
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1EF; --surface:#FFFFFF; --ink:#1C1412; --ink-soft:#6B5955;
    --wine:#7A0C1E; --wine-dark:#4A0812; --wine-soft:rgba(122,12,30,.08);
    --border:rgba(28,20,18,.14); --field:rgba(255,255,255,.62);
    --radius:3px;
  }
  html[data-theme="dark"]{
    --bg:#150909; --surface:#1E1010; --ink:#F3EAE8; --ink-soft:#BFA6A2;
    --wine:#D6435A; --wine-dark:#8C1C2B; --wine-soft:rgba(214,67,90,.14);
    --border:rgba(243,234,232,.16); --field:rgba(255,255,255,.06);
  }
  html.boot, html.boot *{ transition:none!important; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); padding:96px 20px 40px;
    font-family:"Inter Tight",system-ui,-apple-system,sans-serif;
    transition:background-color .3s ease, color .3s ease;
  }

  /* ---------- top bar: back link + toggles ---------- */
  .topbar{
    position:fixed; top:20px; left:20px; right:20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; z-index:2;
  }
  .btn-ghost{
    display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px;
    border-radius:999px; border:1px solid var(--border); background:transparent;
    color:var(--ink); text-decoration:none; font-weight:600; font-size:.88rem;
    letter-spacing:-.01em; cursor:pointer; transition:border-color .2s, color .2s;
  }
  .btn-ghost:hover{ border-color:var(--wine); color:var(--wine); }
  .btn-ghost img{ width:18px; height:18px; display:block; }
  .toggles{ position:absolute; top:16px; right:16px; display:flex; gap:10px; z-index:2; }

  /* ---------- theme/power toggle buttons ---------- */
  .theme-toggle{
    position:relative; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--ink);
    cursor:pointer; transition:border-color .2s, color .2s, transform .3s;
  }
  .theme-toggle:hover{ border-color:var(--wine); color:var(--wine); }
  .theme-toggle:active{ transform:scale(.92); }
  .theme-toggle .ico{position:relative;display:block;width:18px;height:18px;transition:transform .45s cubic-bezier(.33,1,.3,1)}
  .theme-toggle .ico svg{position:absolute;inset:0;width:18px;height:18px;color:currentColor;
    transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.33,1,.3,1)}
  .theme-toggle .icon-sun{opacity:1;transform:rotate(0deg) scale(1)}
  .theme-toggle .icon-moon{opacity:0;transform:rotate(-55deg) scale(.6)}
  html[data-theme="dark"] .theme-toggle .icon-sun{opacity:0;transform:rotate(55deg) scale(.6)}
  html[data-theme="dark"] .theme-toggle .icon-moon{opacity:1;transform:rotate(0deg) scale(1)}
  .theme-toggle:hover .ico{transform:rotate(14deg)}
  .theme-toggle.theme-pulse::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid currentColor;
    opacity:.6;transform:scale(.6);animation:themePulse .7s cubic-bezier(.3,.8,.3,1) both}
  @keyframes themePulse{to{opacity:0;transform:scale(1.35)}}

  .bat{position:relative;box-sizing:content-box;width:18px;height:9px;border:2px solid currentColor;border-radius:3px}
  .bat::before{content:none!important;display:none}
  .bat::after{content:"";position:absolute;right:-5px;top:50%;width:2px;height:4px;margin-top:-2px;background:currentColor;border-radius:0 2px 2px 0}
  .bat i{position:absolute;left:1px;top:1px;bottom:1px;right:1px;border-radius:1px;overflow:hidden;background:currentColor;
    transform-origin:left center;transform:scaleX(1);transition:transform .7s cubic-bezier(.65,0,.25,1),background-color .5s ease}
  .bat i::after{content:"";position:absolute;inset:0;width:60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%);animation:batSheen 2.8s ease-in-out infinite}
  @keyframes batSheen{0%,35%{transform:translateX(-120%)}80%,100%{transform:translateX(220%)}}
  .power-toggle{transition:color .5s ease,border-color .5s ease,transform .3s ease}
  html[data-power="low"] .power-toggle{color:var(--wine);border-color:var(--wine)}
  html[data-power="low"] .bat i{transform:scaleX(.32);transition-duration:.7s!important}
  html[data-power="low"] .bat i::after{display:none}
  .power-toggle .icon-monitor{opacity:1;transform:scale(1)}
  .power-toggle .icon-phone{opacity:0;transform:scale(.55)}
  html[data-power="low"] .power-toggle .icon-monitor{opacity:0;transform:scale(.55)}
  html[data-power="low"] .power-toggle .icon-phone{opacity:1;transform:scale(1)}

  /* ---------- card ---------- */
  .card{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:40px 36px 28px;
    box-shadow:0 32px 64px -24px rgba(50,20,30,.4), 0 16px 32px -16px rgba(0,0,0,.25);
    transition:background-color .3s ease, border-color .3s ease;
  }
  .wordmark{
    position:relative; display:flex; align-items:center; justify-content:center;
    width:fit-content; margin:0 auto 20px; padding:4px 0;
  }
  .wordmark img{ position:relative; z-index:1; display:inline-block; height:92px; width:auto; object-fit:contain; }
  .wordmark .logo-dark{ display:none; }
  html[data-theme="dark"] .wordmark .logo-light{ display:none; }
  html[data-theme="dark"] .wordmark .logo-dark{ display:block; }
  .wordmark-divider{ width:120px; height:1px; margin:0 auto 20px; background:var(--border); }
  .brand-name{ margin:0 0 6px; font-size:1.4rem; font-weight:800; letter-spacing:-.02em; color:var(--ink); text-align:center; }
  .tagline{ margin:0 0 32px; font-size:.78rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); text-align:center; }
  .card h1{ font-size:1.75rem; font-weight:600; letter-spacing:-.04em; line-height:1.1; margin:0 0 8px; }
  .auth-hint{ margin:0 0 28px; color:var(--ink-soft); font-size:.92rem; }
  #authTitle, #authHint{ display:none; }

  #authForm{ display:flex; flex-direction:column; gap:18px; }
  #authForm label{ display:block; font-weight:600; font-size:.84rem; color:var(--ink); margin-bottom:8px; }
  #authForm input{
    width:100%; height:44px; border-radius:12px; background:var(--field); border:1px solid var(--border);
    color:var(--ink); padding:0 14px; font:inherit; transition:border-color .2s, box-shadow .2s;
  }
  #authForm input:focus{ outline:none; border-color:var(--wine); box-shadow:0 0 0 4px var(--wine-soft); }
  .fld-confirm{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease; }
  .fld-confirm .fld-inner{ overflow:hidden; }
  #authForm.is-signup .fld-confirm{ grid-template-rows:1fr; }
  .field-msg{ font-size:.78rem; color:var(--wine); min-height:16px; margin:-6px 0 0; }

  .btn-solid{
    position:relative; width:100%; height:46px; border:none; border-radius:8px; background:var(--wine);
    color:#fff; font:inherit; font-weight:600; font-size:.95rem; cursor:pointer; box-shadow:none;
    transition:background-color .2s;
  }
  .btn-solid:hover{ background:var(--wine-dark); }
  .btn-solid:disabled{ color:transparent; cursor:default; opacity:1; }
  .btn-solid:disabled::after{
    content:""; display:block; position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; background:none; animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .auth-switch{ text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); font-size:.88rem; color:var(--ink-soft); }
  .auth-switch button{ background:none; border:none; color:var(--wine); font-weight:600; font-size:.88rem; cursor:pointer; padding:0; }

  :focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }

  html[data-power="low"] .card{ box-shadow:none; }
  html[data-power="low"] *, html[data-power="low"] *::before, html[data-power="low"] *::after{
    transition-duration:.01s!important; animation-duration:.01s!important;
    backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
  }

  @media(max-width:480px){
    body{ display:block; padding:88px 16px 24px; }
    .topbar{ position:fixed; }
    .card{ max-width:none; padding:32px 24px 24px; margin:0 auto; }
  }
</style>
<style id="visuals">
@property --bg{syntax:'<color>';inherits:true;initial-value:#F7F1EF}
@property --surface{syntax:'<color>';inherits:true;initial-value:#FFFFFF}
@property --ink{syntax:'<color>';inherits:true;initial-value:#1C1412}
@property --ink-soft{syntax:'<color>';inherits:true;initial-value:#6B5955}
@property --wine{syntax:'<color>';inherits:true;initial-value:#7A0C1E}
@property --wine-dark{syntax:'<color>';inherits:true;initial-value:#4A0812}
@property --wine-soft{syntax:'<color>';inherits:true;initial-value:rgba(122,12,30,0.08)}
@property --border{syntax:'<color>';inherits:true;initial-value:rgba(28,20,18,0.14)}
@property --field{syntax:'<color>';inherits:true;initial-value:rgba(255,255,255,.62)}
html{
  transition-property:--bg,--surface,--ink,--ink-soft,--wine,--wine-dark,--wine-soft,--border,--field;
  transition-duration:.6s;
  transition-timing-function:cubic-bezier(.4,0,.2,1);
}
html.boot{transition:none!important}
#aurora,#shapes{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#shapes{transform-origin:50% 50%}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;display:none;background:radial-gradient(60% 50% at 12% 0%,rgba(122,12,30,.2),transparent 70%),radial-gradient(50% 45% at 92% 45%,rgba(212,154,106,.2),transparent 70%),radial-gradient(55% 50% at 40% 105%,rgba(74,8,18,.2),transparent 70%)}
html[data-theme="dark"] body::before{opacity:.85}
html.no-gl body::before,html[data-power="low"] body::before{display:block}
html[data-power="low"] #aurora,html[data-power="low"] #shapes{display:none}
@media(prefers-reduced-motion:reduce){#aurora,#shapes{display:none}body::before{display:block}}
:root{--sp:0}
.geo{--edge:color-mix(in srgb,var(--wine) 52%,transparent);--edge2:color-mix(in srgb,var(--wine) 30%,transparent)}
html[data-theme="dark"] .geo{--edge:color-mix(in srgb,var(--wine) 70%,transparent);--edge2:color-mix(in srgb,var(--wine) 42%,transparent)}
.geo{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;perspective:900px;perspective-origin:50% 38%}
.geo b{position:absolute;left:var(--x);top:var(--y);width:0;height:0;transform-style:preserve-3d;will-change:transform}
.geo i{position:absolute;display:block;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2);transform-style:preserve-3d;
  transform:rotateX(-24deg) rotateY(32deg);animation:spin3d var(--t,22s) linear infinite var(--dir,normal);animation-delay:var(--dl,0s)}
.geo u{position:absolute;display:block;backface-visibility:visible;transition:border-color .6s cubic-bezier(.4,0,.2,1),background-color .6s cubic-bezier(.4,0,.2,1)}
html.boot .geo u{transition:none}
@keyframes spin3d{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.cube u{inset:0;border:1.5px solid var(--edge);background:color-mix(in srgb,var(--wine) var(--a,9%),transparent)}
.cube u:nth-child(1){transform:translateZ(calc(var(--s)/2));--a:13%}
.cube u:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2));--a:5%}
.cube u:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2));--a:9%}
.cube u:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2));--a:7%}
.cube u:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2));--a:16%}
.cube u:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2));--a:4%}
.pyr{--L:calc(var(--s)*1.03)}
.pyr u{left:0;width:var(--s);top:calc(var(--s)/2 - var(--L));height:var(--L);transform-origin:50% 100%;
  background:color-mix(in srgb,var(--wine) var(--a,10%),transparent);clip-path:polygon(50% 0,100% 100%,0 100%)}
.pyr u::after{content:"";position:absolute;inset:0;background:var(--edge);
  clip-path:polygon(evenodd,50% 0,100% 100%,0 100%,50% 0,50% 5%,5% 96%,95% 96%,50% 5%)}
.pyr u:nth-child(2){transform:translateZ(calc(var(--s)/2)) rotateX(29deg);--a:15%}
.pyr u:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2)) rotateX(29deg);--a:8%}
.pyr u:nth-child(4){transform:rotateY(180deg) translateZ(calc(var(--s)/2)) rotateX(29deg);--a:5%}
.pyr u:nth-child(5){transform:rotateY(270deg) translateZ(calc(var(--s)/2)) rotateX(29deg);--a:11%}
.pyr u.bs{top:0;height:var(--s);transform:rotateX(90deg);transform-origin:50% 50%;clip-path:none;border:1.5px solid var(--edge);background:color-mix(in srgb,var(--wine) 4%,transparent)}
.pyr u.bs::after{display:none}
.pyr{margin-top:calc(var(--s)*.18)}
.sph u{inset:0;border:1.5px solid var(--edge2);border-radius:50%}
.sph u:nth-child(2){transform:rotateY(45deg)}.sph u:nth-child(3){transform:rotateY(90deg)}.sph u:nth-child(4){transform:rotateY(135deg)}
.sph::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--edge);transform:rotateX(90deg)}
.g1{--x:14%;--y:20%;--s:70px;--dx:62;--dy:40;--r:140;--t:26s}
.g2{--x:84%;--y:28%;--s:110px;--dx:-66;--dy:90;--r:-120;--t:30s;--dir:reverse;--dl:-6s}
.g3{--x:72%;--y:80%;--s:120px;--dx:-58;--dy:-70;--r:180;--t:34s}
.g4{--x:20%;--y:74%;--s:96px;--dx:64;--dy:-60;--r:-160;--t:24s;--dir:reverse;--dl:-3s}
.g5{--x:50%;--y:14%;--s:60px;--dx:-50;--dy:120;--r:200;--t:20s;--dl:-9s}
.g6{--x:92%;--y:62%;--s:44px;--dx:-72;--dy:-90;--r:240;--t:18s;--dl:-5s}
.g7{--x:8%;--y:46%;--s:140px;--dx:58;--dy:60;--r:100;--t:38s;--dir:reverse}
@supports (animation-timeline:scroll()){
  @keyframes geoSlide{from{transform:translate3d(0,0,0) rotateY(0) rotateX(0)}to{transform:translate3d(calc(var(--dx)*1vw),calc(var(--dy)*1px),0) rotateY(calc(var(--r)*1deg)) rotateX(calc(var(--r)*.3deg))}}
  .geo b{animation:geoSlide linear both;animation-timeline:scroll(root block)}
}
html.geo-js .geo b{transform:translate3d(calc(var(--dx)*var(--sp)*1vw),calc(var(--dy)*var(--sp)*1px),0) rotateY(calc(var(--r)*var(--sp)*1deg));animation:none}
html.geo-js .geo i{animation:spin3d var(--t,22s) linear infinite var(--dir,normal)}
html[data-power="low"] .geo b,html[data-power="low"] .geo i{animation:none!important;will-change:auto}
html[data-power="low"] .geo b{transform:none!important}
html[data-power="low"] .geo u{transition:none!important}
@media(prefers-reduced-motion:reduce){.geo b,.geo i{animation:none!important;transform:none}.geo i{transform:rotateX(-24deg) rotateY(32deg)}}
@media(max-width:760px){.g7,.g6{display:none}.g1{--s:52px}.g2{--s:80px}.g3{--s:84px}.g4{--s:70px}}
.card{position:relative;z-index:1}
.topbar{z-index:2}
</style>
</head>
<body>
<canvas id="aurora" aria-hidden="true"></canvas>
<canvas id="shapes" aria-hidden="true"></canvas>
<div class="geo" aria-hidden="true">
  <b class="g1"><i class="cube"><u></u><u></u><u></u><u></u><u></u><u></u></i></b>
  <b class="g2"><i class="pyr"><u class="bs"></u><u></u><u></u><u></u><u></u></i></b>
  <b class="g3"><i class="sph"><u></u><u></u><u></u><u></u></i></b>
  <b class="g4"><i class="cube"><u></u><u></u><u></u><u></u><u></u><u></u></i></b>
  <b class="g5"><i class="pyr"><u class="bs"></u><u></u><u></u><u></u><u></u></i></b>
  <b class="g6"><i class="cube"><u></u><u></u><u></u><u></u><u></u><u></u></i></b>
  <b class="g7"><i class="sph"><u></u><u></u><u></u><u></u></i></b>
</div>

<div class="topbar">
  <a class="btn-ghost" href="/"><img id="navLogo" src="/logo-light.png" alt="" aria-hidden="true">← Back to Prod99</a>
</div>

<div id="heroLogoWrap" hidden><img id="heroLogo" src="/logo-light.png" alt="" aria-hidden="true"></div>
<img id="footerLogo" src="/logo-light.png" alt="" aria-hidden="true" hidden>

<main class="card">
  <div class="toggles">
    <button class="theme-toggle power-toggle" id="powerToggle" type="button" aria-label="Low power mode" aria-pressed="false" title="Low power mode">
      <span class="ico" aria-hidden="true">
        <svg class="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 4 14 11 14 10 22 20 10 13 10 13 2"/></svg>
        <svg class="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20a7 7 0 0 1-1.2-13.9C15.5 5 17 4.5 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </span>
    </button>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark mode">
      <span class="ico" aria-hidden="true">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>
      </span>
    </button>
  </div>
  <span class="wordmark">
    <img src="/logo-light.png" alt="Prod99" class="logo-light">
    <img src="/logo-dark.png" alt="Prod99" class="logo-dark">
  </span>
  <div class="wordmark-divider"></div>
  <p class="brand-name">Prod99</p>
  <p class="tagline">Teach everywhere, learn from everywhere</p>
  <h1 id="authTitle">Create an account</h1>
  <p class="auth-hint" id="authHint">Pick a username and a password. No email needed.</p>

  <form id="authForm" class="is-signup" novalidate>
    <div>
      <label for="auName">Username</label>
      <input type="text" id="auName" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
    </div>
    <div>
      <label for="auPass">Password</label>
      <input type="password" id="auPass" autocomplete="new-password" required>
    </div>
    <div class="fld-confirm">
      <div class="fld-inner">
        <label for="auConfirm">Confirm password</label>
        <input type="password" id="auConfirm" autocomplete="new-password">
      </div>
    </div>
    <div class="field-msg" id="authMsg" role="alert"></div>
    <button type="submit" class="btn-solid" id="authSubmit">Create account</button>
  </form>

  <p class="auth-switch"><span id="authSwitchText">Already have an account?</span> <button type="button" id="authSwitch">Log in</button></p>
</main>

<div id="authCore" hidden aria-hidden="true">
    <form class="form-panel active" id="panelSignup" novalidate>
      <div>
        <label for="suName">Username</label>
        <input type="text" id="suName" required autocomplete="username">
      </div>
      <div>
        <label for="suPassword">Password</label>
        <input type="password" id="suPassword" required minlength="6" autocomplete="new-password">
      </div>
      <div>
        <label for="suConfirm">Confirm password</label>
        <input type="password" id="suConfirm" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field-msg" id="suMsg"></div>
      <button type="submit" class="btn btn-solid">Create account</button>
    </form>

    <form class="form-panel" id="panelLogin" novalidate>
      <div>
        <label for="liEmail">Username</label>
        <input type="text" id="liEmail" required autocomplete="username">
      </div>
      <div>
        <label for="liPassword">Password</label>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  var root = document.documentElement;
  var LOGO_LIGHT = "/logo-light.png";
  var LOGO_DARK = "/logo-dark.png";
  var navLogo = document.getElementById('logoNav') || document.getElementById('navLogo');
  var heroLogo = document.getElementById('heroLogo');
  var footerLogo = document.getElementById('footerLogo');
  var heroWrap = document.getElementById('heroLogoWrap');
  var toggle = document.getElementById('themeToggle');

  function logoFor(theme){ return theme === 'dark' ? LOGO_DARK : LOGO_LIGHT; }
  function applyLogos(theme){
    var src = logoFor(theme);
    navLogo.src = src;
    heroLogo.src = src;
    footerLogo.src = src;
  }
  function getStoredTheme(){ try{ return localStorage.getItem('prod99_theme'); }catch(e){ return null; } }
  function storeTheme(t){ try{ localStorage.setItem('prod99_theme', t); }catch(e){} }

  var initial = getStoredTheme() || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.setAttribute('data-theme', initial);
  applyLogos(initial);

  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
      if(getStoredTheme()){ return; }
      var next = e.matches ? 'dark' : 'light';
      root.classList.add('theme-anim', 'logo-swap');
      heroWrap.classList.add('swap');
      root.setAttribute('data-theme', next);
      clearTimeout(logoTimer);
      logoTimer = setTimeout(function(){
        applyLogos(next);
        setTimeout(function(){
          root.classList.remove('logo-swap');
          heroWrap.classList.remove('swap');
        }, 30);
      }, 240);
      clearTimeout(animTimer);
      animTimer = setTimeout(function(){ root.classList.remove('theme-anim'); }, 700);
    });
  }

  var logoTimer = null, animTimer = null;
  toggle.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.classList.add('theme-anim', 'logo-swap');
    toggle.classList.add('theme-pulse');
    setTimeout(function(){ toggle.classList.remove('theme-pulse'); }, 700);
    heroWrap.classList.add('swap');
    root.setAttribute('data-theme', next);
    storeTheme(next);
    clearTimeout(logoTimer);
    logoTimer = setTimeout(function(){
      applyLogos(next);
      setTimeout(function(){
        root.classList.remove('logo-swap');
        heroWrap.classList.remove('swap');
      }, 30);
    }, 240);
    clearTimeout(animTimer);
    animTimer = setTimeout(function(){ root.classList.remove('theme-anim'); }, 700);
  });

  var powerBtn = document.getElementById('powerToggle');
  function getStoredPower(){ try{ return localStorage.getItem('prod99_power'); }catch(e){ return null; } }
  function storePower(v){ try{ localStorage.setItem('prod99_power', v); }catch(e){} }
  function applyPower(on){
    if(on){ root.setAttribute('data-power', 'low'); } else { root.removeAttribute('data-power'); }
    powerBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    powerBtn.title = on ? 'Low power mode is on' : 'Low power mode';
  }
  applyPower(getStoredPower() === 'low');
  powerBtn.addEventListener('click', function(){
    var on = root.getAttribute('data-power') !== 'low';
    applyPower(on);
    storePower(on ? 'low' : 'off');
    powerBtn.classList.add('theme-pulse');
    setTimeout(function(){ powerBtn.classList.remove('theme-pulse'); }, 700);
  });

  requestAnimationFrame(function(){ requestAnimationFrame(function(){ root.classList.remove('boot'); }); });

  var panelSignup = document.getElementById('panelSignup');
  var panelLogin = document.getElementById('panelLogin');
  var authForm = document.getElementById('authForm');
  var auName = document.getElementById('auName');
  var auPass = document.getElementById('auPass');
  var auConfirm = document.getElementById('auConfirm');
  var auMsg = document.getElementById('authMsg');
  var auTitle = document.getElementById('authTitle');
  var auHint = document.getElementById('authHint');
  var auSubmit = document.getElementById('authSubmit');
  var auSwitch = document.getElementById('authSwitch');
  var auSwitchText = document.getElementById('authSwitchText');
  var authMode = 'signup';
  var busyTimer = null;
  var inFlight = false;
  var submittedSuccessfully = false;

  function setBusy(on){ clearTimeout(busyTimer); inFlight = on; auSubmit.disabled = on; }
  function setMode(which){
    authMode = which === 'login' ? 'login' : 'signup';
    var signup = authMode === 'signup';
    authForm.classList.toggle('is-signup', signup);
    auTitle.textContent = signup ? 'Create an account' : 'Log in';
    auHint.textContent = signup ? 'Pick a username and a password. No email needed.' : 'Use the username and password you signed up with.';
    auSubmit.textContent = signup ? 'Create account' : 'Log in';
    auSwitchText.textContent = signup ? 'Already have an account?' : 'New here?';
    auSwitch.textContent = signup ? 'Log in' : 'Create an account';
    auPass.setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
    auConfirm.setAttribute('autocomplete', signup ? 'new-password' : 'off');
    auMsg.textContent = '';
    document.getElementById('suMsg').textContent = '';
    document.getElementById('liMsg').textContent = '';
    if(!inFlight){ setBusy(false); }
  }
  function closeModal(){ }
  function toTop(){ window.scrollTo(0, 0); }

  authForm.addEventListener('submit', function(e){
    e.preventDefault();
    if(auSubmit.disabled){ return; }
    if(!authForm.reportValidity()){ return; }
    var panel;
    if(authMode === 'signup'){
      document.getElementById('suName').value = auName.value;
      document.getElementById('suPassword').value = auPass.value;
      document.getElementById('suConfirm').value = auConfirm.value;
      panel = panelSignup;
    } else {
      document.getElementById('liEmail').value = auName.value;
      document.getElementById('liPassword').value = auPass.value;
      panel = panelLogin;
    }
    setBusy(true);
    panel.dispatchEvent(new Event('submit', { cancelable: true }));
  });

  function focusFirstInvalid(){
    if(!auName.value){ auName.focus(); }
    else if(!auPass.value){ auPass.focus(); }
    else if(authForm.classList.contains('is-signup') && auConfirm.value !== auPass.value){ auConfirm.focus(); }
    else { auName.focus(); }
  }
  function mirrorMsg(){
    var src = document.getElementById(authMode === 'signup' ? 'suMsg' : 'liMsg');
    auMsg.textContent = src.textContent;
    if(src.textContent){ setBusy(false); focusFirstInvalid(); }
  }
  if(window.MutationObserver){
    var mo = new MutationObserver(mirrorMsg);
    var moOpts = { childList: true, characterData: true, subtree: true };
    mo.observe(document.getElementById('suMsg'), moOpts);
    mo.observe(document.getElementById('liMsg'), moOpts);
  }

  auSwitch.addEventListener('click', function(){ setMode(authMode === 'signup' ? 'login' : 'signup'); auName.focus(); });

  function safeNext(){
    try{
      var next = new URLSearchParams(location.search).get('next');
      if(next && next.charAt(0) === '/' && next.charAt(1) !== '/' && next.charAt(1) !== '\\'){ return next; }
    }catch(e){}
    return '/dashboard/'; // UPDATED TO NEW DASHBOARD PATH
  }

  var SB_URL = "https://bbsxacrwjezzmxqazast.supabase.co";
  var SB_KEY = "sb_publishable_zSz54-e_PF7nS9l7lzxlCQ_XSo7Trly";
  var LEGACY_KEY = 'prod99_profile_id';
  var sb = null;
  var supabaseFailed = false;
  try{
    if(!window.supabase || !window.supabase.createClient){ throw new Error('Supabase library not loaded'); }
    sb = window.supabase.createClient(SB_URL, SB_KEY);
  }catch(err){
    console.error('Supabase init failed:', err);
    supabaseFailed = true;
    sb = null;
  }
  var P99 = window.P99 = { sb: sb, profile: null, reload: null, failed: supabaseFailed };

  if(supabaseFailed){
    auSubmit.disabled = true;
    auName.disabled = true;
    auPass.disabled = true;
    auConfirm.disabled = true;
    auMsg.textContent = 'Login service is unavailable. Reload to try again.';
  }

  function clearLegacyId(){ try{ localStorage.removeItem(LEGACY_KEY); }catch(e){} }
  function setProfile(profile){
    P99.profile = profile;
    if(profile){ location.replace(safeNext()); }
  }

  if(sb){ sb.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT' && P99.profile){ setProfile(null); } }); }

  async function restoreSession(){
    clearLegacyId();
    if(supabaseFailed || !sb){ setProfile(null); return; }
    try{
      var s = await sb.auth.getSession();
      if(s.error || !s.data || !s.data.session){ setProfile(null); return; }
      var r = await sb.from('profiles').select('id,username').eq('auth_id', s.data.session.user.id).maybeSingle();
      if(r.error){
        console.error('Session restore error:', r.error);
        setProfile(null);
      } else if(r.data){
        setProfile(r.data);
      } else {
        console.error('Auth session has no linked profile row; signing out.');
        await sb.auth.signOut({ scope: 'local' });
        setProfile(null);
      }
    }catch(err){
      console.error('Session restore failed (likely network):', err);
      setProfile(null);
    }
  }

  async function callAuthFn(name, username, password){
    if(supabaseFailed || !sb){ return { ok:false, message:'Login service is unavailable. Reload the page to try again.' }; }
    try{
      var r = await sb.functions.invoke(name, { body: { username: username, password: password } });
      if(r.error){
        console.error(name, r.error);
        var body = null;
        try{ body = await r.error.context.json(); }catch(e){}
        return { ok:false, code: r.error.context && r.error.context.status, message: (body && body.error) || r.error.message };
      }
      if(r.data && r.data.error){ return { ok:false, code: r.data.code, message: r.data.error }; }
      return { ok:true, data: r.data };
    }catch(err){
      console.error(name, err);
      return { ok:false, message: 'Network error' };
    }
  }

  async function applySession(d){
    if(!d || !d.access_token || !d.refresh_token || !d.profile || !d.profile.id){ throw new Error('Malformed login response'); }
    var r = await sb.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
    if(r.error){ throw r.error; }
  }

  panelSignup.addEventListener('submit', async function(e){
    e.preventDefault();
    var msg = document.getElementById('suMsg');
    var username = document.getElementById('suName').value.trim().toLowerCase();
    var pass = document.getElementById('suPassword').value;
    var confirm = document.getElementById('suConfirm').value;

    if(!username || pass.length < 6){ msg.textContent = 'Pick a username and a password of at least 6 characters.'; setBusy(false); return; }
    if(username.length < 3){ msg.textContent = 'Username must be at least 3 characters.'; setBusy(false); return; }
    if(!/^[a-z0-9_]+$/.test(username)){ msg.textContent = 'Username can only use letters, numbers, and underscores.'; setBusy(false); return; }
    if(pass !== confirm){ msg.textContent = 'Passwords don\'t match.'; setBusy(false); return; }

    var res = await callAuthFn('signup', username, pass);
    if(!res.ok){
      if(res.message && res.message.indexOf('unavailable') > -1){ msg.textContent = res.message; }
      else { msg.textContent = (res.code === 409 || res.message === 'Username taken') ? 'That username is already taken.' : 'Something went wrong. Try again.'; }
      setBusy(false); return;
    }
    var lr = await callAuthFn('login', username, pass);
    try{ if(!lr.ok){ throw new Error(lr.message); } await applySession(lr.data); }
    catch(err){
      console.error(err); msg.textContent = 'Account created, but sign-in failed. Try logging in.'; setBusy(false); return;
    }
    setProfile(lr.data.profile);
    msg.textContent = '';
    panelSignup.reset();
    submittedSuccessfully = true;
    setBusy(false);
    closeModal();
    toTop();
  });

  panelLogin.addEventListener('submit', async function(e){
    e.preventDefault();
    var msg = document.getElementById('liMsg');
    var username = document.getElementById('liEmail').value.trim().toLowerCase();
    var pass = document.getElementById('liPassword').value;
    var res = await callAuthFn('login', username, pass);
    if(!res.ok){
      if(res.message && res.message.indexOf('unavailable') > -1){ msg.textContent = res.message; }
      else { msg.textContent = 'No account matches that username and password.'; }
      setBusy(false); return;
    }
    try{ await applySession(res.data); }
    catch(err){
      console.error(err); msg.textContent = 'Could not start your session. Try again.'; setBusy(false); return;
    }
    setProfile(res.data.profile);
    msg.textContent = '';
    panelLogin.reset();
    submittedSuccessfully = true;
    setBusy(false);
    closeModal();
    toTop();
  });

  setMode('signup');
  auName.focus();
  restoreSession();
})();
</script>
